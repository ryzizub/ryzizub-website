server {
    listen       80;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Level 6 instead of the default 1: the page goes out about 13% smaller.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript image/svg+xml image/x-icon application/xml application/json;

    # Every response. A location that sets its own add_header drops these, so
    # /_astro/ below caches with `expires` instead. TLS and HSTS belong to the
    # proxy in front of this container.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # A static Astro build: serve the file, then the page with .html, else the 404 page.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Hashed build assets (CSS, JS, fonts, images) never change under the same name.
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location /.well-known/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";
        try_files $uri $uri/ =404;
    }
}
